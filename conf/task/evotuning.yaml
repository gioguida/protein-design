# @package _global_
# Continued MLM on unpaired OAS. Hyperparameters other than the learning rate
# follow Talaei et al.'s unpaired pretraining stage, which is the stage that
# matches this one; their paired fine-tuning stage uses different values.
#
# The masking policy comes from the data config, so the same task runs every
# arm of the ablation:
#   python scripts/train.py task=evotuning data=evo/oas_cdr50
defaults:
  - override /data: evo/oas_cdr50
  - override /scoring: none
  - _self_

task:
  name: evotuning
  runner: evotuning
  stage_type: evotuning

training:
  learning_rate: 1.0e-5
  warmup_ratio: 0.05
  max_epochs: 1
  max_steps: null
  # 64 x 8 = 512 sequences per optimizer step.
  batch_size: 64
  gradient_accumulation_steps: 8
  bf16: true
  resume_checkpoint: null
  # A checkpoint stays eligible while its framework accuracy is within this
  # many percentage points of the reference, in either direction.
  pareto_fr_tolerance_pp: 0.1
  recovery_n_samples: 2000
  recovery_seed: 42
  # Set only on a single-position continuation, to its branch point's
  # framework accuracy. Left null, a batch-masking run measures itself against
  # the base pretrained model.
  pareto_reference_framework_accuracy: null
